version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - python -m pip install -r tests/requirements.txt
  pre_build:
    commands:
      - python -m pytest tests/unit -q
      - python scripts/template_deploy.py --check-only
  build:
    commands:
      - sam build
      - python scripts/template_deploy.py --deploy-only
