          Type: Api
          Properties:
            Path: /event_register/delete
            Method: DELETE
      Environment:  # ✅ Global environment variables apply to all Lambda functions
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  FaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/face/  # Folder containing app.py and handlers
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
