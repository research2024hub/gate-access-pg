        ListGateAccessGroupsApi:
          Type: Api
          Properties:
            Path: /gate_access_group_link/gate/{gate_id}
            Method: GET
        ListAccessGroupGatesApi:
          Type: Api
          Properties:
            Path: /gate_access_group_link/access_group/{access_group_id}
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  GuestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/guest/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
