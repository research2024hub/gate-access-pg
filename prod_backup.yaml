            Method: DELETE
        GetVehicleDetailsApi:
          Type: Api
          Properties:
            Path: /vehicle/{vehicle_id}
            Method: GET
        ListVehiclesByOwnerApi:
          Type: Api
          Properties:
            Path: /vehicle/person/{personal_info_id}
            Method: GET
      Environment:  # ✅ Global environment variables apply to all Lambda functions
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""
          
  EventFunction:
