        DeletePrivilegeApi:
          Type: Api
          Properties:
            Path: /privilege/delete
            Method: DELETE
        GetPrivilegesApi:
          Type: Api
          Properties:
            Path: /privilege/all
            Method: GET
        GetPrivilegeByIdApi:
          Type: Api
          Properties:
            Path: /privilege/{id}
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/account/  # Folder containing your app.py and handlers
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer  # ✅ Attach Middleware Layer
      Events:
        SignupApi:
          Type: Api
          Properties:
            Path: /account/signup
            Method: POST
        SignupAdminApi:
          Type: Api
          Properties:
            Path: /account/admin-signup
            Method: POST
        # SignupConfirmApi:
        #   Type: Api
        #   Properties:
        #     Path: /account/signup/confirm
        #     Method: POST
        # GetOwnAccountDetailsApi:
        #   Type: Api
        #   Properties:
        #     Path: /account/details/me
        #     Method: GET
        # GetAccountDetailsApi:
        #   Type: Api
        #   Properties:
        #     Path: /account/details/{id}
        #     Method: GET
        ChangeAccountTypeApi:
          Type: Api
          Properties:
            Path: /account/change_type
            Method: POST
        DeactivateAccountApi:
          Type: Api
          Properties:
            Path: /account/deactivate
            Method: POST
        ReactivateAccountApi:
          Type: Api
          Properties:
            Path: /account/reactivate
            Method: POST
        DeleteAccountApi:
          Type: Api
          Properties:
            Path: /account/delete
            Method: DELETE
      Environment:  # ✅ Environment variables for database and JWT
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  AccountTypePrivilegeLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/account_type_privilege_link/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
