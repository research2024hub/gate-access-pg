      Events:
        CreateAccessGroupApi:
          Type: Api
          Properties:
            Path: /access_group/create
            Method: POST
        UpdateAccessGroupApi:
          Type: Api
          Properties:
            Path: /access_group/update
            Method: POST
        DeleteAccessGroupApi:
          Type: Api
          Properties:
            Path: /access_group/delete
            Method: DELETE
        GetAccessGroupsApi:
          Type: Api
          Properties:
            Path: /access_group/all
            Method: GET
        GetAccessGroupByIdApi:
          Type: Api
          Properties:
            Path: /access_group/{id}
            Method: GET  
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  AccountTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/account_type/  # Folder containing your app.py and handlers
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer  # ✅ Attach Middleware Layer
      Events:
        CreateAccountTypeApi:
          Type: Api
          Properties:
            Path: /account_type/create
            Method: POST
        UpdateAccountTypeApi:
          Type: Api
          Properties:
            Path: /account_type/update
            Method: POST
        DeleteAccountTypeApi:
          Type: Api
          Properties:
            Path: /account_type/delete
            Method: DELETE
        GetAccountTypesApi:
          Type: Api
          Properties:
            Path: /account_type/all
            Method: GET
        GetAccountTypeByIdApi:
          Type: Api
          Properties:
            Path: /account_type/{id}
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  PrivilegeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/privilege/  # Folder containing your app.py and handlers
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer  # ✅ Attach Middleware Layer
      Events:
