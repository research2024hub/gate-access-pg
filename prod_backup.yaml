      Events:
        SaveFaceApi:
          Type: Api
          Properties:
            Path: /face/save
            Method: POST
        MatchFaceApi:
          Type: Api
          Properties:
            Path: /face/match
            Method: POST
      Environment:  # ✅ Global environment variables apply to all Lambda functions
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

