            Method: POST
        SendGuestOTPApi:
          Type: Api
          Properties:
            Path: /guest/send_otp
            Method: POST
        DeleteGuestApi:
          Type: Api
          Properties:
            Path: /guest/delete
            Method: DELETE
        ListGuestsApi:
          Type: Api
          Properties:
            Path: /guest/account_holder/{account_holder_id}
            Method: GET
        GetGuestDetailsApi:
          Type: Api
          Properties:
            Path: /guest/{guest_id}
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""
  
  VehicleFunction:
