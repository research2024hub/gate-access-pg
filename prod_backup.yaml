AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  gate-access-pg

  SAM Template for gate-access-pg with PostgreSQL backend.

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 30

Resources:
  MiddlewareLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: shared/  # ✅ Path to the shared middleware
      CompatibleRuntimes:
        - python3.9

  UserAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/user/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      Events:
        RegisterApi:
          Type: Api
          Properties:
            Path: /user/register  # Organized under /user/
            Method: POST
        LoginApi:
          Type: Api
          Properties:
            Path: /user/login  # Organized under /user/
            Method: POST
        GetOwnAccountDetailsApi:
          Type: Api
          Properties:
            Path: /user/accounts/me
            Method: GET
        GetAccountDetailsApi:
          Type: Api
          Properties:
            Path: /user/accounts/{user_id}
            Method: GET
        ChangePasswordApi:
          Type: Api
          Properties:
            Path: /user/change_password  # Organized under /user/
            Method: POST
        ChangeUserTypeApi:
          Type: Api
          Properties:
            Path: /user/change_type  # Organized under /user/
            Method: POST
        DeactivateUserApi:
          Type: Api
          Properties:
            Path: /user/deactivate  # Organized under /user/
            Method: POST
        GetUsersApi:
          Type: Api
          Properties:
            Path: /user/all  # Organized under /user/
            Method: GET
        ActivateUserApi:
          Type: Api
          Properties:
            Path: /user/activate  # Organized under /user/
            Method: POST
      Environment:  # ✅ Global environment variables apply to all Lambda functions
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  EstateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/estate/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      Events:
        CreateEstateApi:
          Type: Api
          Properties:
            Path: /estate/create  # Organized under /estate/
            Method: POST
        UpdateEstateApi:
          Type: Api
          Properties:
            Path: /estate/update  # Organized under /estate/
            Method: POST
        DeleteEstateApi:
          Type: Api
          Properties:
            Path: /estate/delete  # Organized under /estate/
            Method: DELETE
        GetEstatesApi:
          Type: Api
          Properties:
            Path: /estate/all  # Organized under /estate/
            Method: GET
        GetEstateByIdApi:
          Type: Api
          Properties:
            Path: /estate/{id}  # Fetch a specific estate
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  GateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/gate/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      Events:
        CreateGateApi:
          Type: Api
          Properties:
            Path: /gate/create
            Method: POST
        UpdateGateApi:
          Type: Api
          Properties:
            Path: /gate/update
            Method: POST
        GateControllerHeartbeatApi:
          Type: Api
          Properties:
            Path: /gate/heartbeat/{gate_id}
            Method: POST
        DeleteGateApi:
          Type: Api
          Properties:
            Path: /gate/delete
            Method: DELETE
        GetGatesApi:
          Type: Api
          Properties:
            Path: /gate/all
            Method: GET
        GetGateByEstateApi:
          Type: Api
          Properties:
            Path: /gate/estate/{estate_id}
            Method: GET
        GetGateByIdApi:
          Type: Api
          Properties:
            Path: /gate/{id}
            Method: GET
        GetGateVehiclesByGateControllerUntimedApi:
          Type: Api
          Properties:
            Path: /gate/controller/vehicles
            Method: GET
        GetGateVehiclesByGateControllerTimedApi:
          Type: Api
          Properties:
            Path: /gate/controller/timed_vehicles
            Method: GET
        GetGateVehiclesUntimedApi:
          Type: Api
          Properties:
            Path: /gate/vehicles/{gate_id}
            Method: GET
        GetGateVehiclesTimedApi:
          Type: Api
          Properties:
            Path: /gate/timed_vehicles/{gate_id}
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  AccessGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/access_group/  # Folder containing your app.py and handlers
      Handler: app.lambda_handler
