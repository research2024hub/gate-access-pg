          JWT_SECRET: ""



  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

Outputs:
  ApiBaseUrl:
    Description: Base API Gateway endpoint URL for user authentication
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  UserAuthFunctionArn:
    Description: User Authentication Lambda Function ARN
    Value: !GetAtt UserAuthFunction.Arn

  UserAuthFunctionIamRole:
    Description: Implicit IAM Role created for User Authentication function
    Value: !GetAtt UserAuthFunctionRole.Arn

  EstateFunctionArn:
    Description: Estate Lambda Function ARN
    Value: !GetAtt EstateFunction.Arn

  EstateFunctionIamRole:
    Description: Implicit IAM Role created for Estate function
    Value: !GetAtt EstateFunctionRole.Arn

  GateFunctionArn:
    Description: Gate Lambda Function ARN
    Value: !GetAtt GateFunction.Arn

  GateFunctionIamRole:
    Description: Implicit IAM Role created for Gate function
    Value: !GetAtt GateFunctionRole.Arn

  AccessGroupFunctionArn:
    Description: AccessGroup Lambda Function ARN
    Value: !GetAtt AccessGroupFunction.Arn

  AccessGroupFunctionIamRole:
    Description: Implicit IAM Role created for Access Group function
    Value: !GetAtt AccessGroupFunctionRole.Arn