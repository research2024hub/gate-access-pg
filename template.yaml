            Method: POST
        UpdateGateApi:
          Type: Api
          Properties:
            Path: /gate/update
            Method: POST
        UpdateGateControllerHeartbeatApi:
          Type: Api
          Properties:
            Path: /gate/heartbeat
            Method: POST
        ActivateGateApi:
          Type: Api
          Properties:
            Path: /gate/activate
            Method: POST
        DeactivateGateApi:
          Type: Api
          Properties:
            Path: /gate/deactivate
            Method: POST
        GateVehicleArrivalCallbackApi:
          Type: Api
          Properties:
            Path: /gate/vehicle_arrival/callback
            Method: POST
        DeleteGateApi:
          Type: Api
          Properties:
            Path: /gate/delete
            Method: DELETE
        GetGatesApi:
          Type: Api
          Properties:
            Path: /gate/all
            Method: GET
        GetGateByEstateApi:
          Type: Api
          Properties:
            Path: /gate/estate/{estate_id}
            Method: GET
        GetGateByIdApi:
          Type: Api
          Properties:
            Path: /gate/{id}
            Method: GET
        GetGateVehiclesByGateControllerUntimedApi:
          Type: Api
          Properties:
            Path: /gate/controller/vehicles
            Method: GET
        GetGateVehiclesByGateControllerTimedApi:
          Type: Api
          Properties:
            Path: /gate/controller/timed_vehicles
            Method: GET
        GetGateVehiclesUntimedApi:
          Type: Api
          Properties:
            Path: /gate/vehicles/{gate_id}
            Method: GET
        GetGateVehiclesTimedApi:
          Type: Api
          Properties:
            Path: /gate/timed_vehicles/{gate_id}
            Method: GET
        SystemMetricsIngestApi:
          Type: Api
          Properties:
            Path: /system/metrics
            Method: POST
        GetLatestSystemMetricsApi:
          Type: Api
          Properties:
            Path: /system/latest_metrics
            Method: GET
        GetTemperatureTrendApi:
          Type: Api
          Properties:
            Path: /system/temperature
            Method: GET
        GetCameraDowntimeApi:
          Type: Api
          Properties:
            Path: /cameras/downtime
            Method: GET
        GetStorageTrendApi:
          Type: Api
          Properties:
            Path: /system/storage
            Method: GET
        GetAccessDataApi:
          Type: Api
          Properties:
            Path: /system/access
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

