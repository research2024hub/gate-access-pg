AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  gate-access-pg

  SAM Template for gate-access-pg with PostgreSQL backend.

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 30

Resources:
  MiddlewareLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: shared/  # ✅ Path to the shared middleware
      CompatibleRuntimes:
        - python3.9
    # Environment:  # ✅ Global environment variables apply to all Lambda functions
    #     Variables:
    #       DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          # JWT_SECRET: ""

  UserAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/user/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      Events:
        SendUserOTPApi:
          Type: Api
          Properties:
            Path: /user/send_otp  # Organized under /user/
            Method: POST
        # SendUserOTPviaSMSApi:
        #   Type: Api
        #   Properties:
        #     Path: /user/receive_otp  # Organized under /user/
        #     Method: POST
        VerifyUserOTPApi:
          Type: Api
          Properties:
            Path: /user/verify_otp  # Organized under /user/
            Method: POST
        RegisterApi:
          Type: Api
          Properties:
            Path: /user/register  # Organized under /user/
            Method: POST
        RegisterAdminApi:
          Type: Api
          Properties:
            Path: /user/register-admin  # Organized under /user/
            Method: POST
        LoginApi:
          Type: Api
          Properties:
            Path: /user/login  # Organized under /user/
            Method: POST
        GetOwnAccountDetailsApi:
          Type: Api
          Properties:
            Path: /user/accounts/me
            Method: GET
        GetAccountDetailsApi:
          Type: Api
          Properties:
            Path: /user/accounts/{user_id}
            Method: GET
        ChangePasswordApi:
          Type: Api
          Properties:
            Path: /user/change_password  # Organized under /user/
            Method: POST
        ChangeUserTypeApi:
          Type: Api
          Properties:
            Path: /user/change_type  # Organized under /user/
            Method: POST
        DeactivateUserApi:
          Type: Api
          Properties:
            Path: /user/deactivate  # Organized under /user/
            Method: POST
        TestUserEmailApi:
          Type: Api
          Properties:
            Path: /user/emailtest  # Organized under /user/
            Method: POST
        GetUsersApi:
          Type: Api
          Properties:
            Path: /user/all  # Organized under /user/
            Method: GET
        ActivateUserApi:
          Type: Api
          Properties:
            Path: /user/activate  # Organized under /user/
            Method: POST
        ForgotPasswordApi:
          Type: Api
          Properties:
            Path: /user/forgot_password  # Organized under /user/
            Method: POST
        VerifyResetApi:
          Type: Api
          Properties:
            Path: /user/verify_reset_otp  # Organized under /user/
            Method: POST
        DeleteUserApi:
          Type: Api
          Properties:
            Path: /user/delete_user  # Organized under /user/
            Method: POST
        ResetApi:
          Type: Api
          Properties:
            Path: /user/reset_password  # Organized under /user/
            Method: POST
      Environment:  # ✅ Global environment variables apply to all Lambda functions
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  EstateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/estate/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      Events:
        CreateEstateApi:
          Type: Api
          Properties:
            Path: /estate/create  # Organized under /estate/
            Method: POST
        UpdateEstateApi:
          Type: Api
          Properties:
            Path: /estate/update  # Organized under /estate/
            Method: POST
        DeleteEstateApi:
          Type: Api
          Properties:
            Path: /estate/delete  # Organized under /estate/
            Method: DELETE
        GetEstatesApi:
          Type: Api
          Properties:
            Path: /estate/all  # Organized under /estate/
            Method: GET
        GetEstateByIdApi:
          Type: Api
          Properties:
            Path: /estate/{id}  # Fetch a specific estate
            Method: GET
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""

  GateHeartbeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/heartbeat/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64
      Layers:
        - !Ref MiddlewareLayer
      # Events:
      #   HeartbeatSchedule:
      #     # Type: Schedule
      #     Properties:
      #       # Path: /heartbeat/
      #       # Schedule: rate(6 minutes)
      #       Description: "Run every 6 minutes to monitor device heartbeat"
        
      Environment:
        Variables:
          DATABASE_URL: "postgresql://itc:082001@54.246.247.31/gate_access"
          JWT_SECRET: ""
      Policies:
      - SESCrudPolicy:
          IdentityName: "*"
  GateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/gate/  
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
